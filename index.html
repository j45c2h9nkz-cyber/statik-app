<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statik-Programm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="symbol-180.png">
<link rel="icon" href="symbol-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Statik">
<meta name="theme-color" content="#f4f0e8">
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f0e8;color:#2b1d10;
       font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
  main{width:100%;max-width:340px;text-align:center}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px rgba(40,25,10,.2)}
  h1{font-size:22px;margin:16px 0 6px}
  #info{min-height:1.4em;margin:0 0 16px;color:#5a4632}
  #info.fehler{color:#b3261e}
  input{box-sizing:border-box;width:100%;font-size:17px;padding:12px 14px;border:1px solid #cbbba3;border-radius:12px;background:#fffdf9;color:inherit}
  button{width:100%;margin-top:10px;font-size:17px;font-weight:600;padding:12px;border:0;border-radius:12px;background:#7b4a1e;color:#fff}
  button:disabled{opacity:.6}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img src="symbol-180.png" alt="">
  <h1>Statik-Programm</h1>
  <p id="info">Wird geladen …</p>
  <form id="form" hidden>
    <input type="text" value="Statik-App" autocomplete="username" style="display:none" aria-hidden="true">
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <button id="knopf">Öffnen</button>
  </form>
  <button id="nochmals" hidden>Nochmals versuchen</button>
</main>
<script>
// Startseite der Handy-App: holt das verschlüsselte Programm (statik.dat), entschlüsselt es mit dem Passwort und zeigt es an.
// Das Passwort wird nur beim ersten Mal gefragt; danach bleibt der Schlüssel auf diesem Gerät gespeichert.
(function(){
  "use strict";
  var SALZ = "04e4e931aa104610d1e54202a0d7955b", RUNDEN = 600000, ABLAGE = "statikApp.schluessel";
  var info = document.getElementById("info"), form = document.getElementById("form"), pw = document.getElementById("pw"),
      knopf = document.getElementById("knopf"), nochmals = document.getElementById("nochmals");

  function melden(text, fehler){ info.textContent = text; info.className = fehler ? "fehler" : ""; }
  function hexBytes(h){ var a = new Uint8Array(h.length / 2); for(var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function zuText(a){ var s = ""; for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function ausText(s){ var t = atob(s), a = new Uint8Array(t.length); for(var i = 0; i < t.length; i++) a[i] = t.charCodeAt(i); return a; }
  function lesen(){ try { return localStorage.getItem(ABLAGE); } catch(e){ return null; } }
  function merken(v){ try { localStorage.setItem(ABLAGE, v); } catch(e){} }
  function vergessen(){ try { localStorage.removeItem(ABLAGE); } catch(e){} }

  if(!window.crypto || !crypto.subtle || !window.DecompressionStream){
    melden("Dieser Browser ist zu alt für die App (iPhone: iOS 16.4 oder neuer).", true); return;
  }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});

  var daten = fetch("statik.dat", {cache: "no-cache"}).then(function(r){
    if(!r.ok) throw new Error("statik.dat: " + r.status);
    return r.arrayBuffer();
  }).then(function(b){ return new Uint8Array(b); });

  async function ableiten(passwort){
    var basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt: hexBytes(SALZ), iterations: RUNDEN, hash: "SHA-256"},
                                   basis, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
  }

  async function entschluesseln(schluessel){   // wirft bei falschem Passwort
    var d = await daten;
    if(d[0] !== 83 || d[1] !== 84 || d[2] !== 65 || d[3] !== 49) throw new Error("statik.dat: unbekanntes Format");
    var roh = await crypto.subtle.decrypt({name: "AES-GCM", iv: d.slice(4, 16)}, schluessel, d.slice(16));
    return new Response(new Blob([roh]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }

  function anzeigen(html){ document.open(); document.write(html); document.close(); }

  async function start(){
    try { await daten; } catch(e){
      melden("Keine Verbindung. Beim ersten Öffnen braucht die App Internet, danach geht sie auch offline.", true);
      nochmals.hidden = false; return;
    }
    var gespeichert = lesen();
    if(gespeichert){
      try {
        var k = await crypto.subtle.importKey("raw", ausText(gespeichert), "AES-GCM", false, ["decrypt"]);
        anzeigen(await entschluesseln(k)); return;
      } catch(e){ vergessen(); }   // Passwort wurde geändert → neu fragen
    }
    melden("Bitte das Passwort eingeben.");
    form.hidden = false; pw.focus();
  }

  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    if(!pw.value) return;
    knopf.disabled = true; melden("Wird geöffnet …");
    var html;
    try {
      var k = await ableiten(pw.value);
      html = await entschluesseln(k);
      merken(zuText(new Uint8Array(await crypto.subtle.exportKey("raw", k))));
    } catch(e){
      melden("Das Passwort stimmt nicht.", true); knopf.disabled = false; pw.select(); return;
    }
    anzeigen(html);
  });
  nochmals.addEventListener("click", function(){ location.reload(); });
  start();
})();
</script>
</body>
</html>
